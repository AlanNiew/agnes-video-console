# nginx-agnes.conf —— 公网入口模板（域名 + HTTPS + Basic Auth 反代）
#
# 适用：服务器上已有自编译 nginx（--prefix=/usr/local/nginx，主配置
#   /usr/local/nginx/conf/nginx.conf 的 http{} 内已有
#   `include /usr/local/nginx/conf/conf.d/*.conf;`），本文件即丢进该目录的 server 块。
#
# 为什么用 8443 而不是 443：
#   大陆云主机上「未备案域名」访问 80/443 会被拦截，用非标端口即可正常提供 HTTPS。
#   若你的域名已备案，把 listen 改成 443 ssl 即可（同时把 8443 换成 443 放行）。
#
# 为什么必须加鉴权：
#   控制台本身零鉴权，且 Agnes / Fish 的 API Key 就存在它的 SQLite 里 ——
#   裸奔等于把 Key 和额度交出去。Basic Auth + 强密码是最低成本的可接受门槛。
#   更强做法：再加一层 IP 白名单（见文件末尾注释），或改用 Cloudflare Access。
#
# 安装（需要 sudo，用户手动执行）：
#   sudo apt-get install -y apache2-utils
#   sudo htpasswd -cB /usr/local/nginx/conf/htpasswd-agnes alan     # -B = bcrypt，交互输入强密码
#   sudo cp nginx-agnes.conf /usr/local/nginx/conf/conf.d/agnes.conf
#   sudo sed -i 's/<你的域名>/video.example.com/' /usr/local/nginx/conf/conf.d/agnes.conf
#   sudo /usr/local/nginx/sbin/nginx -t && sudo /usr/local/nginx/sbin/nginx -s reload
#   sudo ufw allow 8443/tcp          # 服务器 UFW 实测为 ENABLED
#   # 还要在「华为云控制台 → 安全组」放行 8443/TCP，否则外网仍不通

server {
    listen      8443 ssl;
    server_name <你的域名>;

    # 注意：本机 nginx 是自编译 build，configure 参数里**没有 --with-http_v2_module**
    # （只有 ssl / stub_status / gzip_static / realip），所以既不能用 `http2 on;`
    # （需 1.25.1+），也不能写 `listen 8443 ssl http2;`（缺模块会启动失败）。
    # 走 HTTP/1.1 + keep-alive 即可，本地控制台无性能需求。

    # 证书（acme.sh DNS-01 签发，不占用 80 端口；续期由 acme.sh 的 cron 自动完成）
    ssl_certificate     /usr/local/nginx/certs/agnes.fullchain.pem;
    ssl_certificate_key /usr/local/nginx/certs/agnes.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # 鉴权：整个站点（含 /api 与 /works 成片下载）
    auth_basic           "Agnes Video Console";
    auth_basic_user_file /usr/local/nginx/conf/htpasswd-agnes;

    # 请求体：应用自身 JSON 上限 2 MB（图生图 base64 贴图），留足余量
    client_max_body_size 8m;

    # 成片/素材是大文件，关掉请求侧缓冲，避免上传阶段落盘到临时目录
    proxy_request_buffering off;

    location / {
        proxy_pass         http://127.0.0.1:8273;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 视频拖动进度条依赖 206 分段响应，显式透传 Range
        proxy_set_header Range    $http_range;
        proxy_set_header If-Range $http_if_range;

        # 大文件流式转发：关缓冲，否则 nginx 会整段缓存后再吐
        proxy_buffering off;

        # 渲染任务提交/长轮询可能超过默认 60s
        proxy_connect_timeout 30s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
    }

    # 可选：仅允许固定出口 IP 访问（与 Basic Auth 叠加，二选一或同时用）
    # allow 203.0.113.10;
    # deny  all;
}
